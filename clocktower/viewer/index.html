<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clocktower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="library">
  <div class="brand">
    <svg viewBox="0 0 32 40" aria-hidden="true"><path d="M16 1 L21 9 L21 13 L25 13 L25 39 L7 39 L7 13 L11 13 L11 9 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="21" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M16 18.5 V21 L17.8 22.2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M13 39 V32 a3 3 0 0 1 6 0 V39" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    <div><div class="brand-name">Clocktower</div><div class="brand-sub">Trouble Brewing · the chronicles</div></div>
  </div>
  <div id="games"><div class="empty">Gathering the chronicles…</div></div>
</aside>

<main id="stage">
  <header id="gamebar">
    <div class="titles">
      <h1 id="title">Choose a game</h1>
      <div id="subtitle">Pick a chronicle from the library to watch it unfold.</div>
    </div>
    <div class="controls">
      <label class="select"><span>View</span><select id="view"></select></label>
      <label class="switch"><input type="checkbox" id="thinking"><span class="knob"></span><span>Thoughts</span></label>
    </div>
  </header>

  <section id="table">
    <div id="circle-wrap">
      <div id="circle">
        <svg id="threads" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
        <div id="centre">
          <div id="phase"></div>
          <div id="phase-sub"></div>
          <div id="spotlight"></div>
        </div>
        <div id="tokens"></div>
      </div>
    </div>
    <div id="chronicle" aria-live="polite"></div>
  </section>

  <footer id="transport">
    <div class="buttons">
      <button id="back" title="Step back (←)">&#x23EE;</button>
      <button id="play" class="primary" title="Play / pause (space)">&#x25B6;</button>
      <button id="fwd" title="Step forward (→)">&#x23ED;</button>
    </div>
    <div id="scrub">
      <div id="marks"></div>
      <input type="range" id="scrubber" min="0" max="0" value="0">
    </div>
    <div class="right">
      <span id="position">—</span>
      <select id="speed" title="Speed">
        <option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="10">10×</option>
      </select>
      <button id="live" class="live" hidden>● Live</button>
    </div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
