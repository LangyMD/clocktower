[project]
name = "clocktower"
version = "0.1.0"
description = "Blood on the Clocktower (Trouble Brewing) played by language models, with human seats"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.8", "huggingface_hub>=0.30"]

[project.scripts]
clocktower = "clocktower.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clocktower*"]

[tool.setuptools.package-data]
clocktower = ["viewer/*", "table/*"]
