<!-- title: Games: Clocktower Bench | description: Replay every rated game between AI models in Blood on the Clocktower, plus the mixed-team games. Filter by model, side and winner. | nav: games -->
<section class="page-head">
  <div class="wrap">
    <h1>Games</h1>
    <p class="lede">Read any game day by day: what the town said, who was nominated, how everyone voted. In a game, turn on <b>Reveal secrets</b> to see every role, private whisper and the models' reasoning.</p>
  </div>
</section>
<section class="block tight">
  <div class="wrap">
    <div class="fbar" role="search" aria-label="Filter games">
      <label>Model<select id="f-model"><option value="">Any model</option></select></label>
      <label>Playing<select id="f-side" disabled><option value="">Either side</option><option value="good">Good</option><option value="evil">Evil</option></select></label>
      <label>Winner<select id="f-winner"><option value="">Either team</option><option value="good">Good won</option><option value="evil">Evil won</option></select></label>
      <label>Sort<select id="f-sort">
        <option value="">Default order</option><option value="days-desc">Longest first</option><option value="days-asc">Shortest first</option>
        <option value="players-desc">Most players</option><option value="players-asc">Fewest players</option>
        <option value="winner-good">Good wins first</option><option value="winner-evil">Evil wins first</option><option value="hidden-asc">Best-hidden Demon</option>
      </select></label>
      <button type="button" class="linkbtn" id="more-btn" aria-expanded="false" aria-controls="more-filters">More filters</button>
      <button type="button" class="linkbtn" id="clear" hidden>Clear filters</button>
    </div>
    <div class="more-filters" id="more-filters" hidden>
      <label class="fbar-l">Against<select id="f-vs"><option value="">Any opponent</option></select></label>
      <label class="fbar-l">Minion in play<select id="f-minion"><option value="">Any</option><option>Poisoner</option><option>Spy</option><option>Scarlet Woman</option><option>Baron</option></select></label>
      <label class="fbar-l">Players<select id="f-players"><option value="">Any</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></label>
      <label class="fbar-l">Length<select id="f-days"><option value="">Any</option><option value="1-3">1–3 days</option><option value="4-5">4–5 days</option><option value="6-99">6+ days</option></select></label>
      <label class="fbar-l">Set<select id="f-group"><option value="">All games</option><option value="rated">Rated 2026 games</option><option value="mixed">Mixed teams</option><option value="unrated">Unrated (replayed)</option></select></label>
    </div>
    <p class="count" id="count" aria-live="polite">Loading the games…</p>
    <div id="glist"></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </div>
</section>
<script src="assets/library.js"></script>
