<!doctype html><meta charset="utf-8"><title>Clocktower final ratings</title>
<style>
/* Static chart for the blog (rendered to PNG): Elo by release date with 90% intervals and the all-model trend. */
:root{--bg:#fcfcfb;--ink:#141a22;--ink2:#4b5563;--muted:#7b8494;--grid:#eceef1;--rule:#d6dae0;--anth:#C2562E;--oai:#0A7FA0}
html,body{margin:0;background:var(--bg)}
body{width:1200px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.wrap{padding:44px 52px 34px}
h1{font:700 34px/1.15 "Inter Display",Inter,sans-serif;margin:0 0 16px;letter-spacing:-.01em}
.legend{display:flex;gap:26px;font-size:15px;color:var(--ink2);margin-bottom:4px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px}
svg text{font-family:Inter,sans-serif}
</style>
<div class="wrap">
  <h1>Blood on the Clocktower eval</h1>
  <div class="legend"><span><i style="background:var(--oai);border-radius:2px"></i>OpenAI</span><span><i style="background:var(--anth);border-radius:50%"></i>Anthropic</span></div>
  <svg id="c"></svg>
</div>
<script>
const D=__DATA__;
const N={'claude-opus-4-6':'Opus 4.6','gpt-5.4':'GPT-5.4','claude-opus-4-7':'Opus 4.7','gpt-5.5':'GPT-5.5','claude-opus-4-8':'Opus 4.8','claude-fable-5':'Fable 5','gpt-5.6-sol':'GPT-5.6 Sol','claude-fable-5-1':'Fable 5.1','gpt-6-astra':'GPT-6 Astra','claude-opus-5-5':'Opus 5.5','gpt-6.1-sol':'GPT-6.1 Sol'};
// label side per model, chosen so neighbours with close release dates don't collide
const SIDE={'gpt-6-astra':'left','claude-fable-5-1':'left','claude-opus-5-5':'below','gpt-6.1-sol':'right','gpt-5.6-sol':'above','claude-opus-4-7':'left','gpt-5.5':'right'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('c');
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;svg.appendChild(e);return e};
const W=1096,H=640,L=70,R=92,T=16,B=40,lo=1000,hi=2000;
const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),t0=Date.UTC(2026,0,15),t1=Date.UTC(2026,9,15);
const x=s=>L+(day(s)-t0)/(t1-t0)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
svg.setAttribute('width',W);svg.setAttribute('height',H);
for(let v=lo;v<=hi;v+=100){el('line',{x1:L,x2:W-R+40,y1:y(v),y2:y(v),stroke:'#eceef1'});
  if(v%200===0)el('text',{x:L-12,y:y(v)+5,'text-anchor':'end','font-size':14,fill:'#7b8494'},v.toLocaleString('en-US'))}
for(let m=1;m<=9;m++){const s=`2026-${String(m+1).padStart(2,'0')}-01`;
  el('line',{x1:x(s),x2:x(s),y1:H-B,y2:H-B+6,stroke:'#d6dae0'});
  el('text',{x:x(s),y:H-B+26,'text-anchor':'middle','font-size':14,fill:'#7b8494'},MON[m]+' 2026'.slice(0,0))}
el('line',{x1:L,x2:W-R+40,y1:H-B,y2:H-B,stroke:'#d6dae0'});
el('text',{x:16,y:(T+H-B)/2,'text-anchor':'middle','font-size':15,'font-weight':600,fill:'#4b5563',transform:`rotate(-90 16 ${(T+H-B)/2})`},'Elo');
const mx=xs.reduce((a,b)=>a+b)/xs.length, my=vs.reduce((a,b)=>a+b)/vs.length;
for(const m of D.models){const c=m.lab==='Anthropic'?'#C2562E':'#0A7FA0',cx=x(m.date),cy=y(m.combined);
  el('line',{x1:cx,x2:cx,y1:y(m.c90[0]),y2:y(m.c90[1]),stroke:c,'stroke-width':3,'stroke-linecap':'round','stroke-opacity':.4})}
for(const m of D.models){const c=m.lab==='Anthropic'?'#C2562E':'#0A7FA0',cx=x(m.date),cy=y(m.combined),side=SIDE[m.id]||'right';
  if(m.lab==='Anthropic')el('circle',{cx,cy,r:8,fill:c,stroke:'#fcfcfb','stroke-width':2.5});
  else el('rect',{x:cx-7.5,y:cy-7.5,width:15,height:15,rx:2,fill:c,stroke:'#fcfcfb','stroke-width':2.5});
  const [lx,ly,an]=side==='left'?[cx-14,cy+5,'end']:side==='below'?[cx,cy+30,'middle']:side==='above'?[cx,cy-18,'middle']:[cx+14,cy+5,'start'];
  const t=el('text',{x:lx,y:ly,'text-anchor':an,'font-size':15,'font-weight':600,fill:'#141a22',stroke:'#fcfcfb','stroke-width':5,'paint-order':'stroke','stroke-linejoin':'round'},N[m.id]+' ');
  const n=document.createElementNS(NS,'tspan');n.setAttribute('fill','#7b8494');n.setAttribute('font-weight','500');n.textContent=m.combined.toLocaleString('en-US');t.appendChild(n);
}
</script>
