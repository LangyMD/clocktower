<!doctype html><meta charset="utf-8"><title>Evil win rate by skill</title>
<style>
/* Static figure for the blog: evil's win rate in evenly matched games, by how strong both teams are. */
html,body{margin:0;background:#fcfcfb}
body{width:1200px;font-family:Inter,system-ui,sans-serif;color:#141a22}
.wrap{padding:44px 52px 30px}
h1{font:700 34px/1.15 "Inter Display",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{font-size:16px;color:#4b5563;margin:0 0 6px;max-width:1040px;line-height:1.45}
svg text{font-family:Inter,sans-serif}
</style>
<div class="wrap">
  <h1>As both sides get smarter, evil wins less often</h1>
  <p class="sub">Chance the evil team wins when the two teams are evenly matched, by how strong both teams are. Line: fit over all 386 games, with its 90% interval shaded. Dots: actual evil win rate in games where the two models were within 200 Elo of each other.</p>
  <svg id="c"></svg>
</div>
<script>
const C=__CURVE__, P=__POINTS__;
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('c');
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;svg.appendChild(e);return e};
const W=1096,H=540,L=90,R=40,T=20,B=64,x0=1200,x1=1900,y0=0,y1=0.6;
const x=v=>L+(v-x0)/(x1-x0)*(W-L-R), y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
svg.setAttribute('width',W);svg.setAttribute('height',H);
for(let v=0;v<=0.6001;v+=0.1){el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:v===0?'#cfd4db':'#eceef1'});
  el('text',{x:L-14,y:y(v)+5,'text-anchor':'end','font-size':15,fill:'#7b8494'},Math.round(v*100)+'%')}
for(let v=1200;v<=1900;v+=100)el('text',{x:x(v),y:H-B+28,'text-anchor':'middle','font-size':15,fill:'#7b8494'},v.toLocaleString('en-US'));
el('text',{x:(L+W-R)/2,y:H-8,'text-anchor':'middle','font-size':16,'font-weight':600,fill:'#4b5563'},'Skill of both teams (average Elo)');
el('text',{x:16,y:(T+H-B)/2,'text-anchor':'middle','font-size':16,'font-weight':600,fill:'#4b5563',transform:`rotate(-90 16 ${(T+H-B)/2})`},'Evil win rate');
const band=C.map(c=>`${x(c[0])},${y(c[3])}`).concat(C.slice().reverse().map(c=>`${x(c[0])},${y(c[2])}`)).join(' ');
el('polygon',{points:band,fill:'#7a5bb5','fill-opacity':.14});
el('polyline',{points:C.map(c=>`${x(c[0])},${y(c[1])}`).join(' '),fill:'none',stroke:'#7a5bb5','stroke-width':3});
for(const p of P){el('circle',{cx:x(p.x),cy:y(p.p),r:7,fill:'#141a22'});
  el('text',{x:x(p.x),y:y(p.p)-14,'text-anchor':'middle','font-size':14,fill:'#4b5563'},`${Math.round(p.p*100)}% (${p.e}/${p.n})`)}
</script>
