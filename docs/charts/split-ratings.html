<!doctype html><meta charset="utf-8"><title>Detection vs deception</title>
<style>
/* Static figure for the blog: detection (good) and deception (evil) ratings, ranked side by side. */
html,body{margin:0;background:#fcfcfb}
body{width:1200px;font-family:Inter,system-ui,sans-serif;color:#141a22}
.wrap{padding:44px 52px 40px}
h1{font:700 34px/1.15 "Inter Display",Inter,sans-serif;margin:0 0 14px;letter-spacing:-.01em}
.legend{display:flex;gap:26px;font-size:16px;color:#4b5563;margin-bottom:22px}
.legend i{display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}
h2{font:700 22px/1.2 "Inter Display",Inter,sans-serif;margin:0 0 4px}
.cap{font-size:15px;color:#6b7280;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:18px}
td{padding:9px 6px;border-bottom:1px solid #eceef1}
td.n{text-align:right;font-variant-numeric:tabular-nums;color:#4b5563;width:70px}
td.r{color:#9aa3af;width:28px;font-variant-numeric:tabular-nums}
.m{display:inline-block;width:12px;height:12px;margin-right:10px;vertical-align:0}
</style>
<div class="wrap">
  <h1>Detection vs deception</h1>
  <div class="legend"><span><i style="background:#0A7FA0;border-radius:2px"></i>OpenAI</span><span><i style="background:#C2562E;border-radius:50%"></i>Anthropic</span></div>
  <div class="cols">
    <div><h2>Detection</h2><p class="cap">Elo when playing the good team</p><table id="d"></table></div>
    <div><h2>Deception</h2><p class="cap">Elo when playing the evil team</p><table id="v"></table></div>
  </div>
</div>
<script>
const D=__DATA__;
const N={'claude-opus-4-6':'Opus 4.6','gpt-5.4':'GPT-5.4','claude-opus-4-7':'Opus 4.7','gpt-5.5':'GPT-5.5','claude-opus-4-8':'Opus 4.8','claude-fable-5':'Fable 5','gpt-5.6-sol':'GPT-5.6 Sol','claude-fable-5-1':'Fable 5.1','gpt-6-astra':'GPT-6 Astra','claude-opus-5-5':'Opus 5.5','gpt-6.1-sol':'GPT-6.1 Sol'};
for(const [id,key] of [['d','detection'],['v','deception']]){
  const t=document.getElementById(id);
  [...D.models].sort((a,b)=>b[key]-a[key]).forEach((m,i)=>{
    const a=m.lab==='Anthropic', s=`background:${a?'#C2562E':'#0A7FA0'};border-radius:${a?'50%':'2px'}`;
    t.insertAdjacentHTML('beforeend',`<tr><td class="r">${i+1}</td><td><span class="m" style="${s}"></span>${N[m.id]}</td><td class="n">${m[key].toLocaleString('en-US')}</td></tr>`)})}
</script>
