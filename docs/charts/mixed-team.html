<!doctype html><meta charset="utf-8"><title>Mixed team</title>
<style>
/* Static figure for the blog: mixed Opus 5.5 + GPT-5.6 Sol team vs each model alone, overall / good / evil. */
html,body{margin:0;background:#fcfcfb}
body{width:1200px;font-family:Inter,system-ui,sans-serif;color:#141a22}
.wrap{padding:44px 52px 30px}
h1{font:700 34px/1.15 "Inter Display",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{font-size:16px;color:#4b5563;margin:0 0 4px;max-width:1040px;line-height:1.45}
svg text{font-family:Inter,sans-serif}
</style>
<div class="wrap">
  <h1>A team split across two models plays slightly worse</h1>
  <p class="sub">Half Claude Opus 5.5 and half GPT-5.6 Sol, seats assigned at random, against each model playing alone. Dashed line: the average of the two models alone. Bars: 90% intervals.</p>
  <svg id="c"></svg>
</div>
<script>
const R=__DATA__;
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('c');
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;svg.appendChild(e);return e};
const W=1096,H=540,T=44,B=70,lo=1200,hi=1800,y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
svg.setAttribute('width',W);svg.setAttribute('height',H);
el('text',{x:220,y:(T+H-B)/2,'text-anchor':'middle','font-size':16,'font-weight':600,fill:'#4b5563',transform:`rotate(-90 220 ${(T+H-B)/2})`},'Elo');
for(let v=lo;v<=hi;v+=100)el('text',{x:284,y:y(v)+5,'text-anchor':'end','font-size':14,fill:'#7b8494'},v.toLocaleString('en-US'));
const S=[['claude-opus-5-5','Opus 5.5\nalone','#C2562E','c'],['gpt-5.6-sol','GPT-5.6 Sol\nalone','#0A7FA0','s'],['mixed','Mixed\nteam','#7a5bb5','d']];
const P=[['combined','Overall']];
P.forEach(([k,title],i)=>{const x0=300,x1=800,r=R[k];
  
  for(let v=lo;v<=hi;v+=100)el('line',{x1:x0,x2:x1,y1:y(v),y2:y(v),stroke:v===lo?'#cfd4db':'#eceef1'});
  const avg=r.members_mean[0];
  el('line',{x1:x0+10,x2:x1-10,y1:y(avg),y2:y(avg),stroke:'#6b7280','stroke-width':1.5,'stroke-dasharray':'6 5'});
  S.forEach(([id,label,c,shape],j)=>{const cx=x0+90+j*160,[v,[a,b]]=r[id],st={stroke:c,'stroke-width':3,'stroke-linecap':'round','stroke-opacity':.4};
    el('line',{x1:cx,x2:cx,y1:y(a),y2:y(b),...st});for(const q of [a,b])el('line',{x1:cx-7,x2:cx+7,y1:y(q),y2:y(q),...st});
    if(shape==='c')el('circle',{cx,cy:y(v),r:9,fill:c});
    else if(shape==='s')el('rect',{x:cx-8.5,y:y(v)-8.5,width:17,height:17,rx:2.5,fill:c});
    else el('rect',{x:cx-8.5,y:y(v)-8.5,width:17,height:17,fill:c,transform:`rotate(45 ${cx} ${y(v)})`});
    el('text',{x:cx+14,y:y(v)+5,'font-size':15,'font-weight':600,fill:'#141a22',stroke:'#fcfcfb','stroke-width':6,'paint-order':'stroke'},v.toLocaleString('en-US'));
    label.split('\n').forEach((ln,li)=>el('text',{x:cx,y:H-B+24+li*18,'text-anchor':'middle','font-size':14,fill:'#4b5563'},ln))});
  const e=r.effect[0];el('text',{x:(x0+x1)/2,y:24,'text-anchor':'middle','font-size':16,fill:e<-100?'#b4232c':'#4b5563','font-weight':600},`Mixing effect: ${e>0?'+':'−'}${Math.abs(e)} Elo (${r.effect[1][0]} to ${r.effect[1][1]>0?'+':''}${r.effect[1][1]})`);
});
</script>
